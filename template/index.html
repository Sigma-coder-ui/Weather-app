<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.weather-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:30px;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    margin-bottom:20px;
    font-size:2rem;
}

form{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:white;
    color:#0072ff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.weather-card{
    margin-top:20px;
}

.temp{
    font-size:4rem;
    font-weight:bold;
}

.city{
    font-size:1.8rem;
    margin:10px 0;
}

.desc{
    text-transform:capitalize;
    font-size:1.2rem;
}

.details{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

.detail-box{
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    width:48%;
}

.label{
    font-size:14px;
    opacity:0.8;
}

.value{
    font-size:20px;
    margin-top:5px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="weather-box">

<h1>🌤 Weather App</h1>

<form method="POST">
    <input type="text"
           name="city"
           placeholder="Enter city name"
           required>

    <button type="submit">
        Search
    </button>
</form>

{% if weather %}

<div class="weather-card">

<div class="temp">
    {{ weather.temperature }}°C
</div>

<div class="city">
    {{ weather.city }}
</div>

<div class="desc">
    {{ weather.description }}
</div>

<div class="details">

    <div class="detail-box">
        <div class="label">Humidity</div>
        <div class="value">
            {{ weather.humidity }}%
        </div>
    </div>

    <div class="detail-box">
        <div class="label">Wind Speed</div>
        <div class="value">
            {{ weather.wind }} m/s
        </div>
    </div>

</div>

</div>

{% endif %}

</div>

</div>

</body>
</html>
